<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8f6f1"/><g font-family="Arial,sans-serif" fill="#25343c"><text x="42" y="55" font-size="34" font-weight="bold">Gartensauna V3 · L-Form</text><text x="42" y="85" font-size="18">Konzeptgrundriss · Außenmaße in mm · Maßstab schematisch proportional</text></g>
<!-- footprint 3200x1700 base, right wing 2000 wide extends 2000 -->
<path d="M130 180 H770 V740 H370 V520 H130 Z" fill="#ecd9bc" stroke="#745238" stroke-width="12"/>
<!-- dividing wall at x370 -->
<path d="M370 180 V520" stroke="#745238" stroke-width="10"/>
<!-- access door left front -->
<path d="M190 520 H280" stroke="#f8f6f1" stroke-width="16"/><path d="M190 520 V430 A90 90 0 0 1 280 520" fill="none" stroke="#0c8c9b" stroke-width="3"/>
<!-- sauna door through partition -->
<path d="M370 305 V395" stroke="#ecd9bc" stroke-width="17"/><path d="M370 305 H460 A90 90 0 0 1 370 395" fill="none" stroke="#0c8c9b" stroke-width="3"/>
<!-- bench in changing room -->
<rect x="160" y="225" width="65" height="215" rx="5" fill="#b68b5b"/><text x="195" y="333" font-size="18" text-anchor="middle" transform="rotate(-90 195 333)" font-family="Arial" fill="#fff">Sitzbank</text>
<!-- sauna bench along right wing, 2m in y -->
<rect x="670" y="300" width="65" height="400" fill="#bd8c56"/><rect x="610" y="300" width="55" height="400" fill="#d7ad78"/>
<!-- stove -->
<rect x="440" y="220" width="80" height="75" rx="6" fill="#69757a"/><text x="480" y="264" font-family="Arial" fill="white" font-size="17" text-anchor="middle">Ofen</text>
<!-- glazing front facing garden on bottom -->
<path d="M405 740 H750" stroke="#178e9b" stroke-width="11"/><text x="575" y="778" font-family="Arial" font-size="20" text-anchor="middle" fill="#178e9b">Glasfront zum Garten</text>
<g font-family="Arial" fill="#423324"><text x="262" y="277" text-anchor="middle" font-size="22" font-weight="bold">Umkleide</text><text x="260" y="303" text-anchor="middle" font-size="16">beheizbar</text><text x="530" y="455" font-size="26" font-weight="bold">Sauna</text><text x="525" y="485" font-size="17">Liegebänke</text><text x="525" y="507" font-size="17">2 Ebenen</text></g>
<g font-family="Arial" font-size="18" fill="#25343c" stroke="#25343c" stroke-width="2"><path d="M130 147 H770 M130 137 V157 M770 137 V157"/><text x="450" y="134" stroke="none" text-anchor="middle">3.200</text><path d="M92 180 V520 M82 180 H102 M82 520 H102"/><text x="72" y="350" stroke="none" transform="rotate(-90 72 350)" text-anchor="middle">1.700</text><path d="M805 520 V740 M795 520 H815 M795 740 H815"/><text x="835" y="630" stroke="none" transform="rotate(90 835 630)" text-anchor="middle">zusätzlich 2.000</text><path d="M370 795 H770 M370 785 V805 M770 785 V805"/><text x="570" y="819" stroke="none" text-anchor="middle">Flügelbreite 2.000 (Annahme)</text></g>
<text x="42" y="804" font-family="Arial" font-size="14" fill="#555">Die Türpositionen, Liegebanklängen und Wanddicken sind schematisch; vor Ausführung maßlich zu verifizieren.</text></svg>