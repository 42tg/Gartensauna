name: Render CAD to Blender
on:
  push:
    branches: [main]
    paths:
      - 'cad/**'
      - 'scripts/**'
      - '.github/workflows/render-cad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install CAD and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad blender xvfb
      - name: Export individual CAD meshes
        run: xvfb-run -a python3 scripts/export_meshes.py
      - name: Render assembled
        run: blender -b -t 2 --python-exit-code 1 -P scripts/create_blender.py -- assembled
      - name: Render exploded
        run: blender -b -t 2 --python-exit-code 1 -P scripts/create_blender.py -- exploded
      - name: Verify generated files
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path("build/blender")
          for variant in ("assembled", "exploded"):
              stem = root / f"gartensauna_{variant}"
              blend = stem.with_suffix(".blend").read_bytes()
              assert blend.startswith(b"BLENDER"), f"Invalid Blender file: {stem}"
              png = stem.with_suffix(".png").read_bytes()
              assert png[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {stem}"
              assert struct.unpack(">II", png[16:24]) == (1600, 1100)
              report = json.loads(stem.with_suffix(".json").read_text())
              assert len(report["parts"]) == 8, report
              print(variant, "verified: 8 CAD parts, Blender file, 1600x1100 PNG")
          PY
      - name: Upload Blender models and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gartensauna-cad-blender
          path: |
            build/meshes/
            build/blender/
          if-no-files-found: warn
