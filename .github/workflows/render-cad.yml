name: Render CAD to Blender
on:
  push:
    branches: [main]
    paths:
      - 'cad/**'
      - 'scripts/**'
      - '.github/workflows/render-cad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
      - name: Export individual CAD meshes
        run: xvfb-run -a python3 scripts/export_meshes.py
      - uses: actions/upload-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes/
          if-no-files-found: error
  render:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        view: [assembled, exploded, wall_detail, cutaway, heater_detail]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - uses: actions/download-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes
      - name: Render view
        run: blender -b -t 2 --python-exit-code 1 -P scripts/create_blender.py -- ${{ matrix.view }}
      - name: Verify generated files
        run: python3 scripts/verify_render.py ${{ matrix.view }}
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.view }}
          path: build/blender/
          if-no-files-found: error
  package:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes
      - uses: actions/download-artifact@v4
        with:
          pattern: render-*
          merge-multiple: true
          path: build/blender
      - name: Upload all Blender models and renders
        uses: actions/upload-artifact@v4
        with:
          name: gartensauna-cad-blender
          path: build/
          if-no-files-found: error

