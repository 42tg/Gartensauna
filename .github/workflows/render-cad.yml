name: Render CAD to Blender
on:
  push:
    branches: [main]
    paths:
      - 'cad/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CAD
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y openscad xvfb python3-shapely
      - name: Verify layout and both door swings against CAD
        run: python3 scripts/audit_layout.py
      - name: Export individual CAD meshes
        run: xvfb-run -a python3 scripts/export_meshes.py
      - uses: actions/upload-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes/
          if-no-files-found: error
          # Job handoff; meshes are also included in the final download.
          retention-days: 7
  render:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        view: [assembled, exploded, wall_detail, cutaway, heater_detail]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y blender
      - uses: actions/download-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes
      - name: Render view
        run: blender -b -t 2 --python-exit-code 1 -P scripts/create_blender.py -- ${{ matrix.view }}
      - name: Verify generated files
        run: python3 scripts/verify_render.py ${{ matrix.view }}
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.view }}
          path: build/blender/
          if-no-files-found: error
          # Keep intermediate views briefly for diagnostics and failed package retries.
          retention-days: 7
  package:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes
      - uses: actions/download-artifact@v4
        with:
          pattern: render-*
          merge-multiple: true
          path: build/blender
      - name: Upload all Blender models and renders
        uses: actions/upload-artifact@v4
        with:
          name: gartensauna-cad-blender
          path: build/
          if-no-files-found: error
          # Preserve the complete user-facing CAD/Blender download.
          retention-days: 90
  web:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cad-meshes
          path: build/meshes
      - uses: actions/download-artifact@v4
        with:
          pattern: render-*
          merge-multiple: true
          path: build/blender
      - name: Install export tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender openscad
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export exact Blender geometry and CAD drawings
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          blender -b -t 2 --python-exit-code 1 -P scripts/export_web.py -- build/blender web/assets
          python3 scripts/web_drawings.py
      - run: npm ci && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: gartensauna-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 30
