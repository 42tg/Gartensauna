name: Thermal sauna CFD
on:
  push:
    branches: [main]
    paths:
      - 'cad/**'
      - 'simulation/thermal/**'
      - 'simulation/requirements.txt'
      - 'scripts/thermal_*.py'
      - 'scripts/run_thermal.py'
      - 'scripts/build_thermal_boundary.sh'
      - 'scripts/simulate_ventilation.py'
      - 'tests/test_thermal*'
      - '.github/workflows/thermal-ventilation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thermal-cfd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - name: Install pinned solver and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openfoam=1912.200626-2build3 libopenfoam=1912.200626-2build3 openscad build-essential flex bison curl
          pip install -r simulation/requirements.txt
      - name: Build energy-preserving thermal boundary
        run: bash scripts/build_thermal_boundary.sh
      - name: Test mixed-boundary conservation and CAD mesh topology
        run: |
          g++ -std=c++11 tests/test_thermal_relaxation.cpp -o build/test-thermal-relaxation
          build/test-thermal-relaxation
          OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -v
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('simulation/thermal/config.json'))
          print('cases='+json.dumps([x['name'] for x in c['cases']]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thermal-boundary-library
          path: build/thermal-lib/libsaunaThermal.so
          retention-days: 14
  solve:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.build.outputs.cases) }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - name: Install pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openfoam=1912.200626-2build3 libopenfoam=1912.200626-2build3 openscad
          pip install -r simulation/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: thermal-boundary-library
          path: build/thermal-lib
      - name: Generate mesh, solve heat and flow, audit balances
        run: python scripts/run_thermal.py '${{ matrix.case }}' --require-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfd-${{ matrix.case }}
          path: build/thermal/${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: [build, solve]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cfd-*
          path: build/thermal-artifacts
      - name: Summarize only numerically qualified cases
        run: |
          python scripts/thermal_compare.py --root build/thermal-artifacts
          cat build/thermal-comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: thermal-comparison
          path: build/thermal-comparison/
          retention-days: 14
