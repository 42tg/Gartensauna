name: Ventilation comparison
on:
  push:
    branches: [main]
    paths:
      - 'cad/**'
      - 'simulation/**'
      - 'scripts/simulate_ventilation.py'
      - 'scripts/check_ventilation_cad.py'
      - 'tests/test_ventilation.py'
      - '.github/workflows/ventilation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - name: Install solver and CAD evaluator
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          pip install -r simulation/requirements.txt
      - name: Verify numerical conservation and geometry
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_ventilation_cad.py
      - name: Compare placements, flow rates and numerical sensitivity
        run: python scripts/simulate_ventilation.py
      - name: Publish comparison summary
        run: cat build/ventilation/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ventilation-comparison
          path: build/ventilation/
          if-no-files-found: error
          retention-days: 14
